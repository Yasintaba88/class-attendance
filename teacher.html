<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل معلم</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="topbar"><div class="brand">👩‍🏫 پنل مدیریت حضور و غیاب</div><div class="pill">معلم</div></div><section id="login" class="panel center"><h2>ورود به پنل معلم</h2><p class="muted">رمز پنل را وارد کنید.</p><input id="pass" type="password" inputmode="numeric" placeholder="رمز عبور"><br><br><button id="loginBtn">ورود</button><p class="tiny muted">رمز اولیه نسخه تحویلی: 19121912</p></section><section id="dashboard" class="hidden"><section class="panel"><div class="grid"><div><label>شروع حضور</label><input id="start" type="time"></div><div><label>پایان حضور</label><input id="end" type="time"></div></div><br><div class="grid3"><button id="saveTime">ذخیره زمان</button><button id="switch" class="danger">بستن حضور</button><button id="reset" class="secondary">پاک‌سازی امروز</button></div><br><div id="liveStatus" class="status open">...</div></section><section class="panel"><h3>گزارش زنده امروز</h3><p id="date" class="muted"></p><div id="count" class="status open">...</div><div id="list" class="student-list"></div></section><section class="panel"><h3>نام ۲۹ دانش‌آموز</h3><p class="muted">نام‌ها را وارد کنید و ذخیره کنید.</p><div id="names" class="name-grid"></div><br><button id="saveNames">ذخیره نام‌ها</button></section><section class="panel"><h3>لینک دانش‌آموزان</h3><div id="studentLink" class="linkbox"></div><br><button id="copyLink">کپی لینک</button></section></section></main><div id="toast" class="toast hidden"></div><script type="module" src="teacher.js"></script></body></html>
